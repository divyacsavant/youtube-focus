<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Focus Feed</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #212121;
            --accent-color: #ff0000;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --border-color: #3f3f3f;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--accent-color);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-card {
            background: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-panel {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .url-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #121212;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: 1px solid var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .section-title {
            font-size: 1rem;
            margin: 20px 0 10px 0;
            color: var(--text-secondary);
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .preset-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preset-btn:hover {
            border-color: var(--text-secondary);
        }

        .preset-btn strong {
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>▶</span> YouTube Focus Feed</h1>
    </header>

    <div class="main-container">
        <!-- Pinned Video Player Section -->
        <div class="player-card">
            <div class="video-wrapper">
                <div id="youtube-player"></div>
            </div>
            <div class="control-panel">
                <form class="url-form" id="urlForm" onsubmit="handleUrlSubmit(event)">
                    <input type="text" id="urlInput" placeholder="Paste YouTube URL or Shorts link here..." required>
                    <button type="submit">Always Pin This</button>
                </form>
            </div>
        </div>

        <!-- Quick Access Slots -->
        <div class="section-title">Quick Access Pins</div>
        <div class="presets-grid" id="presetsGrid">
            <button class="preset-btn" onclick="loadVideo('k8ctm3I0RY0')">
                <strong>Boredom & Creativity Short</strong>
                <span style="font-size: 0.8rem; color: #aaa;">Click to test</span>
            </button>
        </div>
    </div>

    <script>
        // Load default or previously saved video ID
        let currentVideoId = localStorage.getItem('pinnedVideoId') || 'k8ctm3I0RY0';
        let player;

        // Load YouTube IFrame API script asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                playerVars: {
                    'autoplay': 1,
                    'modestbranding': 1,
                    'rel': 0
                }
            });
        };

        // Bulletproof universal URL/Shorts ID extractor
        function extractVideoId(input) {
            if (!input) return null;
            
            // Extract pure URL if text or title block was pasted alongside it
            const urlMatch = input.match(/(https?:\/\/[^\s]+)/);
            const cleanInput = urlMatch ? urlMatch[1] : input.trim();

            // If user passed just the raw 11-character token
            if (cleanInput.length === 11) return cleanInput;

            // Universal regex matching standard, shortened, and shorts URLs
            const regExp = /^.*(?:(?:v|be|shorts)\/|v%3D|v=|=)([a-zA-Z0-9_-]{11})/;
            const match = cleanInput.match(regExp);
            
            if (match && match[1]) {
                return match[1];
            }

            // Fallback iteration check across path split tokens
            const parts = cleanInput.split(/[\/\?=\&]/);
            for (let part of parts) {
                if (part.length === 11 && /^[a-zA-Z0-9_-]+$/.test(part)) {
                    return part;
                }
            }

            return null;
        }

        function handleUrlSubmit(event) {
            event.preventDefault();
            const inputVal = document.getElementById('urlInput').value;
            const videoId = extractVideoId(inputVal);
            
            if (videoId) {
                currentVideoId = videoId;
                localStorage.setItem('pinnedVideoId', videoId);
                
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(videoId);
                } else {
                    location.reload();
                }
                document.getElementById('urlInput').value = '';
            } else {
                alert('Could not find a valid YouTube video or Shorts ID. Please check the link.');
            }
        }

        function loadVideo(videoId) {
            currentVideoId = videoId;
            localStorage.setItem('pinnedVideoId', videoId);
            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
            }
        }
    </script>
</body>
</html>
