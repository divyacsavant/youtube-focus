<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Focus Feed</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #212121;
            --accent-color: #ff0000;
            --text-color: #f1f1f1;
            --text-secondary: #aaa;
            --border-color: #3f3f3f;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            color: var(--accent-color);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-card {
            background: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .control-panel {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .url-form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #121212;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: 1px solid var(--accent-color);
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .section-title {
            font-size: 1rem;
            margin: 20px 0 10px 0;
            color: var(--text-secondary);
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .preset-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preset-btn:hover {
            border-color: var(--text-secondary);
        }

        .preset-btn strong {
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1><span>▶</span> YouTube Focus Feed</h1>
    </header>

    <div class="main-container">
        <!-- Pinned Video Player Section -->
        <div class="player-card">
            <div class="video-wrapper">
                <!-- The IFrame API will mount the player here -->
                <div id="youtube-player"></div>
            </div>
            <div class="control-panel">
                <form class="url-form" id="urlForm" onsubmit="handleUrlSubmit(event)">
                    <input type="text" id="urlInput" placeholder="Paste YouTube Video URL or ID here..." required>
                    <button type="submit">Always Pin This</button>
                </form>
            </div>
        </div>

        <!-- Quick Access Slots -->
        <div class="section-title">Quick Access Pins</div>
        <div class="presets-grid" id="presetsGrid">
            <!-- Dynamically populated or standard quick buttons -->
            <button class="preset-btn" onclick="loadVideo('dQw4w9WgXcQ')">
                <strong>Sample Video 1</strong>
                <span style="font-size: 0.8rem; color: #aaa;">Click to test feed</span>
            </button>
        </div>
    </div>

    <script>
        // Default target video (Change this ID to your favorite video/reel ID)
        let currentVideoId = localStorage.getItem('pinnedVideoId') || 'dQw4w9WgXcQ';
        let player;

        // Load YouTube IFrame API script asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // This function is called automatically by the YouTube API once loaded
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: currentVideoId,
                playerVars: {
                    'autoplay': 1,
                    'modestbranding': 1,
                    'rel': 0 // Shows related videos from the same channel/queue when finished instead of stopping dead
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        // Detects when the current video ends and handles transition
        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED = 0
            if (event.data === 0) {
                // Video finished. By setting 'rel': 0 and letting the player naturally proceed, 
                // it will show related recommendations or loop if configured.
                console.log("Video ended. Moving to next recommendation.");
            }
        }

        // Extract YouTube ID from various URL formats
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        // Handle user pasting a new URL
        function handleUrlSubmit(event) {
            event.preventDefault();
            const inputVal = document.getElementById('urlInput').value;
            const videoId = extractVideoId(inputVal);
            
            if (videoId && videoId.length === 11) {
                currentVideoId = videoId;
                localStorage.setItem('pinnedVideoId', videoId);
                
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(videoId);
                } else {
                    location.reload();
                }
                document.getElementById('urlInput').value = '';
            } else {
                alert('Please enter a valid YouTube video URL or ID.');
            }
        }

        // Quick load preset function
        function loadVideo(videoId) {
            currentVideoId = videoId;
            localStorage.setItem('pinnedVideoId', videoId);
            if (player && typeof player.loadVideoById === 'function') {
                player.loadVideoById(videoId);
            }
        }
    </script>
</body>
</html>
